<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Café Socratique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Plan: comic look in the French colours, one screen per étape, a dialogue thread (Socrate left, the group right).
   Single light theme by choice. */
:root{
  --bleu:#0055A4; --rouge:#EF4135; --blanc:#FFFFFF;
  --ink:#14213D; --ink-soft:#4B5578; --bg:#F4F7FD; --line:#D5DCEF;
  --gold:#FFC93D; --gold-bg:#FFF4CC; --teal:#14A38B; --teal-bg:#DDF7F1; --blue-bg:#E1EEFF; --red-bg:#FFE4E1;
  --display:'Bangers','Impact',cursive; --body:'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif;
  color-scheme:light;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(0,85,164,.13) 1.4px, transparent 1.8px);
  background-size:16px 16px;
  font-family:var(--body); font-size:18px; color:var(--ink); line-height:1.4;
  padding:18px 16px 56px; min-height:100vh;
}
.wrap{ max-width:860px; margin:0 auto; }
button,textarea,input{ font-family:inherit; color:inherit; }
:focus-visible{ outline:4px solid var(--gold); outline-offset:2px; }
.de{ color:var(--ink-soft); font-size:15px; font-weight:700; }

.home-link{ display:inline-block; font-family:var(--display); letter-spacing:.05em; font-size:17px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px; padding:4px 16px; text-decoration:none; box-shadow:3px 3px 0 var(--ink); margin-bottom:14px; transition:transform .12s ease, box-shadow .12s ease; }
.home-link:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); background:var(--gold-bg); }
/* ---------- hero ---------- */
.hero{ background:var(--bleu); border:4px solid var(--ink); border-radius:22px; padding:22px 26px 38px; color:#fff; position:relative; overflow:hidden; box-shadow:7px 7px 0 var(--ink); }
.hero::before{ content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.17) 2px, transparent 2.6px); background-size:16px 16px; pointer-events:none; }
.hero::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:16px; border-top:4px solid var(--ink); background:linear-gradient(90deg,var(--bleu) 0 33.33%,#fff 33.33% 66.66%,var(--rouge) 66.66% 100%); }
.hero > *{ position:relative; z-index:1; }
.eyebrow{ display:inline-block; font-family:var(--display); font-size:15px; letter-spacing:.08em; background:#fff; color:var(--bleu); border:3px solid var(--ink); border-radius:8px; padding:1px 12px; transform:rotate(-2deg); box-shadow:2px 2px 0 var(--ink); }
.hero h1{ font-family:var(--display); font-weight:400; font-size:clamp(38px,8vw,62px); letter-spacing:.03em; line-height:1.02; margin:10px 0 6px; text-shadow:3px 3px 0 var(--rouge), 6px 6px 0 var(--ink); text-wrap:balance; }
.hero p{ margin:0; font-weight:700; font-size:18px; max-width:470px; }
.hero .bubble{ position:absolute; right:24px; top:22px; background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:18px; padding:8px 16px; font-family:var(--display); font-size:22px; letter-spacing:.04em; transform:rotate(3deg); box-shadow:4px 4px 0 var(--ink); }
.hero .bubble::after{ content:""; position:absolute; left:22px; bottom:-13px; width:18px; height:18px; background:#fff; border-right:3px solid var(--ink); border-bottom:3px solid var(--ink); transform:rotate(45deg); }
@media(max-width:700px){ .hero .bubble{ display:none; } .hero{ padding:20px 20px 36px; } }

/* ---------- HUD ---------- */
.hud{ position:sticky; top:8px; z-index:20; margin:18px 0 20px; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:10px 14px 12px; }
.hud[hidden]{ display:none; }
.hud-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pills{ display:flex; gap:6px; flex-wrap:wrap; flex:1 1 300px; min-width:0; }
.pill{ font-family:var(--display); letter-spacing:.04em; font-size:16px; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:1px 12px; cursor:pointer; }
.pill[disabled]{ opacity:.45; cursor:default; }
.pill.on{ background:var(--bleu); color:#fff; }
.pill.done{ background:var(--teal-bg); }
.clock{ display:flex; align-items:center; gap:8px; margin-left:auto; }
.clock b{ font-family:var(--display); font-weight:400; font-size:30px; letter-spacing:.05em; line-height:1; font-variant-numeric:tabular-nums; }
.clock.over b{ color:var(--rouge); }
.mini-btn{ font-family:var(--display); letter-spacing:.05em; font-size:15px; background:var(--gold); border:3px solid var(--ink); border-radius:999px; padding:1px 14px; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
.stepline{ display:flex; align-items:center; gap:10px; margin-top:8px; }
.stepbar{ flex:1; height:12px; border:3px solid var(--ink); border-radius:999px; background:var(--blue-bg); overflow:hidden; }
.stepbar i{ display:block; height:100%; width:0; background:var(--teal); }
.stepbar.over i{ background:var(--rouge); }
.stepnote{ font-size:15px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
@media(max-width:560px){ .stepline{ flex-wrap:wrap; } .stepbar{ flex-basis:100%; order:2; } }

/* ---------- cards & headings ---------- */
.card{ background:#fff; border:4px solid var(--ink); border-radius:20px; padding:22px 24px 24px; box-shadow:6px 6px 0 var(--ink); margin-bottom:22px; }
.step-title{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 6px; }
.step-title h2{ font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:clamp(28px,5vw,38px); color:var(--bleu); margin:0; line-height:1.05; text-wrap:balance; }
.tag{ font-family:var(--display); letter-spacing:.06em; font-size:15px; color:#fff; background:var(--rouge); border:3px solid var(--ink); border-radius:8px; padding:0 10px; transform:rotate(-2deg); }
.lead{ margin:4px 0 16px; font-weight:700; }
.rule-box{ background:var(--gold-bg); border:3px solid var(--ink); border-left-width:10px; border-left-color:var(--bleu); border-radius:12px; padding:10px 14px; margin:14px 0; font-size:17px; }
.rule-box b{ font-weight:700; }

/* ---------- buttons ---------- */
.btn{ font-family:var(--display); font-size:21px; letter-spacing:.05em; background:var(--bleu); color:#fff; border:3px solid var(--ink); border-radius:12px; padding:8px 24px; cursor:pointer; box-shadow:4px 4px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease; }
.btn:hover:not([disabled]){ transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink); }
.btn:active:not([disabled]){ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
.btn[disabled]{ background:#9fb3cf; cursor:not-allowed; }
.btn.alt{ background:#fff; color:var(--ink); }
.btn.go{ background:var(--rouge); }
.nav{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:6px; }
.nav .why{ font-size:15px; font-weight:700; color:var(--ink-soft); flex:1 1 200px; }

/* ---------- intro ---------- */
.plan{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:14px 0; padding:0; list-style:none; }
.plan li{ background:var(--blue-bg); border:3px solid var(--ink); border-radius:14px; padding:10px 14px; }
.plan .min{ font-family:var(--display); letter-spacing:.05em; font-size:15px; color:var(--rouge); }
.plan b{ display:block; font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:21px; line-height:1.1; }
.plan span.s{ font-size:15px; font-weight:700; color:var(--ink-soft); }
.roles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:12px 0 18px; }
.role{ border:3px solid var(--ink); border-radius:14px; padding:10px 14px; background:#fff; }
.role b{ font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:20px; display:block; color:var(--bleu); }
.role span{ font-size:16px; font-weight:700; }
label.f{ display:block; font-family:var(--display); letter-spacing:.05em; font-size:19px; margin:6px 0 4px; }
input.txt{ width:100%; max-width:420px; font-size:19px; font-weight:700; padding:9px 12px; border:3px solid var(--ink); border-radius:12px; background:#fff; }
textarea.ta{ width:100%; min-height:96px; font-size:19px; font-weight:700; line-height:1.35; padding:10px 12px; border:3px solid var(--ink); border-radius:12px; background:#fff; resize:vertical; }

/* ---------- quality cards ---------- */
.count{ font-family:var(--display); letter-spacing:.05em; font-size:20px; margin:0 0 10px; }
.count b{ font-weight:400; color:var(--rouge); }
.qgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
.qcard{ position:relative; text-align:left; background:#fff; border:3px solid var(--ink); border-radius:14px; padding:12px 14px 12px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease, background .12s ease; display:flex; flex-direction:column; gap:2px; min-width:0; }
.qcard b{ font-size:19px; line-height:1.15; overflow-wrap:anywhere; }
.qcard .de{ font-size:14px; }
.qcard:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
.qcard[aria-pressed="true"]{ background:var(--teal-bg); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.qcard[aria-pressed="true"]::after{ content:"✓"; position:absolute; right:8px; top:6px; width:26px; height:26px; line-height:22px; text-align:center; font-weight:700; background:var(--teal); color:#fff; border:3px solid var(--ink); border-radius:50%; font-size:15px; }
.qcard[aria-pressed="true"] b{ padding-right:30px; }

/* ---------- dialogue ---------- */
.thread{ display:flex; flex-direction:column; gap:20px; margin:22px 0 6px; }
.msg{ max-width:min(640px,92%); position:relative; border:3px solid var(--ink); border-radius:18px; padding:14px 16px 12px; font-weight:700; font-size:19px; }
.msg .who{ position:absolute; top:-14px; left:14px; font-family:var(--display); letter-spacing:.06em; font-size:14px; line-height:1.3; padding:0 10px; border:3px solid var(--ink); border-radius:8px; color:#fff; }
.msg.socrate{ align-self:flex-start; background:#fff; box-shadow:4px 4px 0 var(--ink); }
.msg.socrate .who{ background:var(--rouge); }
.msg.nous{ align-self:flex-end; background:var(--blue-bg); box-shadow:-4px 4px 0 var(--ink); }
.msg.nous .who{ background:var(--bleu); left:auto; right:14px; }
.msg.nous .stance{ font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:20px; color:var(--bleu); }
.msg.nous p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.socrate.small{ font-size:17px; background:var(--gold-bg); }
.stances{ display:flex; gap:10px; flex-wrap:wrap; align-self:flex-end; }
.stance-btn{ font-family:var(--display); letter-spacing:.04em; font-size:19px; background:#fff; border:3px solid var(--ink); border-radius:12px; padding:6px 16px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.stance-btn:hover{ background:var(--gold-bg); }
.stance-btn.on{ background:var(--bleu); color:#fff; transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.stances.mini .stance-btn{ font-size:15px; padding:2px 12px; }
.answer{ background:#fff; border:3px dashed var(--ink); border-radius:16px; padding:12px 14px 14px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0; }
.chip{ font-family:var(--body); font-weight:700; font-size:15px; background:var(--gold-bg); border:2px solid var(--ink); border-radius:999px; padding:3px 12px; cursor:pointer; text-align:left; }
.chip:hover{ background:var(--gold); }
.chip.fixed{ cursor:default; background:#fff; }
.chip.fixed:hover{ background:#fff; }
.aide{ background:var(--blue-bg); border:3px solid var(--ink); border-radius:12px; padding:10px 14px 12px; margin:10px 0 0; }
.aide h4{ font-family:var(--display); font-weight:400; letter-spacing:.05em; font-size:17px; margin:0 0 2px; color:var(--bleu); }
.aide h4 + .chips{ margin-top:4px; }
.aide h4:not(:first-child){ margin-top:10px; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
.row .hint{ font-size:15px; font-weight:700; color:var(--ink-soft); }

/* ---------- définition ---------- */
.field{ margin:0 0 20px; }
.stem{ font-weight:700; font-size:20px; margin:0 0 6px; }
.stem em{ font-style:normal; color:var(--rouge); }
.forms{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 8px; }
.checks{ display:grid; gap:8px; margin:6px 0 4px; padding:0; list-style:none; }
.checks label{ display:flex; gap:10px; align-items:flex-start; font-weight:700; cursor:pointer; }
.checks input{ width:24px; height:24px; margin:2px 0 0; accent-color:var(--bleu); flex:none; }

/* ---------- carte ---------- */
.poster{ background:#fff; border:4px solid var(--ink); border-radius:20px; overflow:hidden; box-shadow:6px 6px 0 var(--ink); margin-bottom:20px; }
.poster-head{ background:var(--bleu); color:#fff; padding:14px 22px 22px; position:relative; border-bottom:4px solid var(--ink); }
.poster-head::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:12px; border-top:4px solid var(--ink); background:linear-gradient(90deg,var(--bleu) 0 33.33%,#fff 33.33% 66.66%,var(--rouge) 66.66% 100%); }
.poster-head small{ font-family:var(--display); letter-spacing:.08em; font-size:15px; opacity:.9; }
.poster-head h3{ font-family:var(--display); font-weight:400; letter-spacing:.04em; font-size:clamp(28px,5vw,40px); margin:0; line-height:1.05; text-shadow:2px 2px 0 var(--rouge), 4px 4px 0 var(--ink); overflow-wrap:anywhere; }
.poster-body{ padding:18px 22px 6px; display:grid; gap:16px; }
.sec h4{ font-family:var(--display); font-weight:400; letter-spacing:.06em; font-size:17px; margin:0 0 4px; color:var(--rouge); }
.sec p{ margin:0; font-weight:700; white-space:pre-wrap; overflow-wrap:anywhere; }
.sec .qs{ display:flex; gap:8px; flex-wrap:wrap; }
.sec .qs span{ background:var(--teal-bg); border:3px solid var(--ink); border-radius:999px; padding:1px 14px; font-weight:700; }
.sec .dim{ color:var(--ink-soft); font-weight:700; font-style:italic; }
.qa{ border-left:6px solid var(--bleu); padding:2px 0 2px 12px; }
.qa .q{ font-size:16px; color:var(--ink-soft); font-weight:700; }
.qa .st{ font-family:var(--display); letter-spacing:.04em; color:var(--bleu); font-size:19px; }
.poster-foot{ padding:10px 22px 14px; }
.final{ background:var(--gold-bg); border:3px solid var(--ink); border-radius:14px; padding:12px 16px; margin:0 22px 18px; font-weight:700; }
.copybox{ width:100%; min-height:150px; font-size:15px; border:3px solid var(--ink); border-radius:12px; padding:10px; margin-top:10px; background:#fff; }

footer.foot{ margin-top:30px; text-align:center; font-family:var(--display); letter-spacing:.08em; font-size:19px; background:linear-gradient(90deg,var(--bleu) 0 33.33%,#fff 33.33% 66.66%,var(--rouge) 66.66% 100%); border:4px solid var(--ink); border-radius:14px; padding:6px 10px; box-shadow:4px 4px 0 var(--ink); }
footer.foot span{ background:#fff; border:3px solid var(--ink); border-radius:8px; padding:0 14px; }

@media(max-width:560px){
  body{ font-size:17px; }
  .card{ padding:18px 16px 20px; }
  .msg{ max-width:100%; font-size:18px; }
  .poster-body,.poster-foot{ padding-left:16px; padding-right:16px; }
  .final{ margin-left:16px; margin-right:16px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
@media print{
  body{ background:#fff; padding:0; }
  .hero,.hud,.nav,.btn,.row,footer.foot,.noprint{ display:none !important; }
  .poster{ box-shadow:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="index.html">← Accueil</a>

  <header class="hero">
    <div class="bubble">Pote ou ami ?</div>
    <span class="eyebrow">Vivre ensemble · Les copains</span>
    <h1>Le Café Socratique</h1>
    <p>Socrate pose les questions. Votre groupe cherche les réponses.</p>
  </header>

  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="pills" id="pills"></div>
      <div class="clock" id="clock"><b id="total">20:00</b><button type="button" class="mini-btn" id="pause">Pause</button></div>
    </div>
    <div class="stepline">
      <div class="stepbar" id="stepbar"><i id="stepfill"></i></div>
      <div class="stepnote" id="stepnote"></div>
    </div>
  </div>

  <main id="stage"></main>

  <footer class="foot"><span>10ab Horlacher</span></footer>
</div>

<script>
// ============ données ============
const STEPS = [
  { name:'Échauffement', min:4 },
  { name:'Dialogue',     min:9 },
  { name:'Définition',   min:5 },
  { name:'Notre carte',  min:2 }
];

const QUALITIES = [
  ['la confiance','das Vertrauen'],
  ['l’humour','der Humor'],
  ['la loyauté','die Treue'],
  ['l’honnêteté','die Ehrlichkeit'],
  ['le temps passé ensemble','gemeinsame Zeit'],
  ['les mêmes goûts','gleiche Interessen'],
  ['le soutien dans les moments difficiles','Unterstützung in schweren Zeiten'],
  ['la discrétion','Verschwiegenheit']
];

const STARTERS = ['À mon avis, …','Je pense que … parce que …','Je ne suis pas d’accord, car …','Ça dépend de …','Par exemple, …'];

const QUESTIONS = [
  { short:'Pote ou ami ?',
    ask:'Un pote et un ami : c’est la même chose ?',
    stances:[
      { label:'Oui, c’est pareil', reply:'Vraiment ? Alors pourquoi le français a-t-il deux mots ? Imaginez une situation où vous diriez « mon pote », mais jamais « mon ami ».' },
      { label:'Non, c’est différent', reply:'Intéressant. Quelle est la différence exactement ? Donnez un exemple concret : une personne que vous appelleriez « pote » et une autre que vous appelleriez « ami(e) ».' },
      { label:'Ça dépend', reply:'De quoi dépend-elle, cette différence ? Du moment, de la personne qui parle, de l’âge ? Soyez précis.' }
    ],
    thanks:'Merci. Gardez ce critère en tête : il va vous servir pour la définition.',
    vocab:[['un pote','Kumpel'],['un copain / une copine','Kumpel, Freund/in'],['un(e) meilleur(e) ami(e)','beste/r Freund/in'],['rigoler','lachen, Spaß haben'],['traîner','abhängen'],['se confier','sich anvertrauen'],['faire confiance','vertrauen'],['quoi qu’il arrive','was auch passiert']] },
  { short:'Beaucoup d’amis ?',
    ask:'Peut-on avoir beaucoup d’amis ?',
    stances:[
      { label:'Oui, beaucoup', reply:'Et les 500 « amis » sur les réseaux sociaux : ce sont de vrais amis ? Où est la limite ?' },
      { label:'Non, très peu', reply:'Alors que fait-on des personnes qu’on aime bien, mais qu’on ne connaît pas assez ? Comment les appeler ?' },
      { label:'Ça dépend', reply:'Essayez de classer : ami proche, copain, connaissance. Qui est qui pour vous ?' }
    ],
    thanks:'Merci. Vous venez de faire une distinction importante.',
    vocab:[['une connaissance','Bekannte/r'],['un abonné','Follower'],['les réseaux sociaux','soziale Netzwerke'],['proche','eng, nah'],['s’entendre bien','sich gut verstehen'],['perdre de vue','aus den Augen verlieren'],['se voir rarement','sich selten sehen']] },
  { short:'Dire la vérité ?',
    ask:'Un vrai ami doit-il toujours dire la vérité, même si elle fait mal ?',
    stances:[
      { label:'Oui, toujours', reply:'Même si la vérité peut détruire l’amitié ? Où est la limite entre honnêteté et méchanceté ?' },
      { label:'Non, pas toujours', reply:'Alors un ami peut mentir ? Pour protéger l’autre, ou pour se protéger soi-même ? Est-ce la même chose ?' },
      { label:'Ça dépend', reply:'Sur quoi peut-on être honnête sans blesser ? Écrivez une phrase qu’un ami pourrait dire avec tact.' }
    ],
    thanks:'Merci. Voilà le genre de question qu’on ne résout pas en une minute.',
    vocab:[['dire la vérité','die Wahrheit sagen'],['mentir','lügen'],['un mensonge','eine Lüge'],['blesser','verletzen'],['décevoir','enttäuschen'],['protéger','schützen'],['être sincère','aufrichtig sein'],['avec tact','taktvoll']] }
];

const AMI_CHIPS  = ['me soutient quand ça va mal','garde mes secrets','me dit la vérité, même si c’est dur','est là quoi qu’il arrive','me fait rire'];
const POTE_CHIPS = ['je rigole et je traîne','je fais du sport ou je joue','je passe du bon temps, mais je ne dis pas tout'];
const SUBJ_CHIPS = ['Il faut qu’un ami soit …','Je ne pense pas qu’un pote puisse …','Il est important qu’un ami ait …','Je veux que mes amis sachent …'];
const SUBJ_FORMS = [['être','soit'],['avoir','ait'],['pouvoir','puisse'],['savoir','sache'],['faire','fasse'],['aller','aille'],['vouloir','veuille']];
const CHECKS = ['Nos phrases sont complètes et en français.','Nous avons au moins un exemple concret.','Le porte-parole peut lire la définition à voix haute.'];

// ============ état ============
const S = {
  step:0, max:0, group:'', picks:[],
  vals:{ drop:'', q0:'', q1:'', q2:'', ami:'', pote:'', subj:'' },
  q:[ {stance:null,sent:false,help:false},{stance:null,sent:false,help:false},{stance:null,sent:false,help:false} ],
  qi:0, dropHelp:false, checks:[false,false,false],
  total:1200, stepSec:0, running:false, copyFail:false, confirmReset:false, focusKey:null, scrollTo:null
};

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = s => { const m = Math.floor(Math.abs(s)/60), r = Math.abs(s)%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); };
const len = k => S.vals[k].trim().length;

// ============ HUD & Zeit ============
function updateHud(){
  const hud = $('#hud');
  hud.hidden = S.step === 0;
  if(S.step === 0) return;
  $('#pills').innerHTML = STEPS.map((s,i)=>{
    const n = i+1;
    const cls = n===S.step ? 'on' : (n<S.step ? 'done' : '');
    return `<button type="button" class="pill ${cls}" data-act="goto" data-n="${n}" ${n>S.max?'disabled':''} aria-current="${n===S.step?'step':'false'}">${n} · ${s.name}</button>`;
  }).join('');
  tick(true);
}
function tick(noCount){
  if(S.step === 0) return;
  if(!noCount && S.running){ S.total--; S.stepSec++; }
  const budget = STEPS[S.step-1].min*60;
  $('#total').textContent = (S.total<0?'-':'') + fmt(S.total);
  $('#clock').classList.toggle('over', S.total <= 0);
  const pct = Math.min(100, S.stepSec/budget*100);
  $('#stepfill').style.width = pct+'%';
  $('#stepbar').classList.toggle('over', S.stepSec > budget);
  const note = S.stepSec > budget ? 'Zeit-Tipp überschritten: bald weitermachen' : `Zeit-Tipp für diese Etappe: ${STEPS[S.step-1].min} min`;
  $('#stepnote').textContent = note;
  $('#pause').textContent = S.running ? 'Pause' : 'Weiter';
}
setInterval(()=>{ if(S.running) tick(); }, 1000);

// ============ Bausteine ============
function chipsHTML(key, arr){
  return `<div class="chips">${arr.map(t=>`<button type="button" class="chip" data-act="chip" data-key="${key}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
}
function taHTML(key, id, ph){
  return `<textarea class="ta" id="${id}" data-key="${key}" placeholder="${esc(ph||'')}" spellcheck="false" autocomplete="off">${esc(S.vals[key])}</textarea>`;
}
function socrate(text, extra){ return `<div class="msg socrate ${extra||''}"><span class="who">SOCRATE</span>${text}</div>`; }
function nous(inner){ return `<div class="msg nous"><span class="who">NOUS</span>${inner}</div>`; }

// ============ Etappen ============
function viewIntro(){
  return `<section class="card" aria-labelledby="t0">
    <div class="step-title"><h2 id="t0">Bienvenue au café</h2><span class="tag">20 min · en groupe</span></div>
    <p class="lead">Vous êtes à la page 2 du livre. Socrate veut comprendre ce que « ami » et « pote » veulent vraiment dire pour vous.<br><span class="de">Ihr arbeitet in der Gruppe am Tablet. Socrate stellt Fragen, ihr diskutiert auf Französisch und tippt eure Antworten.</span></p>

    <ol class="plan" aria-label="Plan">
      ${STEPS.map((s,i)=>`<li><span class="min">${s.min} MIN</span><b>${i+1}. ${s.name}</b><span class="s">${['Qualités choisir','3 questions de Socrate','Une phrase à vous','Résultat à présenter'][i]}</span></li>`).join('')}
    </ol>

    <h3 style="font-family:var(--display);font-weight:400;letter-spacing:.05em;font-size:22px;margin:16px 0 0;color:var(--bleu)">Les rôles</h3>
    <div class="roles">
      <div class="role"><b>Secrétaire</b><span>tape les réponses</span></div>
      <div class="role"><b>Modérateur·trice</b><span>veille au français et au temps</span></div>
      <div class="role"><b>Porte-parole</b><span>présente à la classe</span></div>
    </div>

    <div class="rule-box"><b>Règles :</b> Il n’y a pas de bonne ou de mauvaise réponse, mais il faut toujours dire <b>pourquoi</b>. Tout le groupe parle français. Une personne tape, tout le monde discute.</div>

    <label class="f" for="gname">Nom du groupe</label>
    <input class="txt" id="gname" type="text" value="${esc(S.group)}" placeholder="p. ex. Les Philosophes" autocomplete="off" spellcheck="false" maxlength="40">
    <div class="nav" style="margin-top:20px"><button type="button" class="btn go" data-act="start">C’est parti !</button></div>
  </section>`;
}

function viewEtape1(){
  const n = S.picks.length;
  const ready = n === 3;
  const names = S.picks.map(i=>QUALITIES[i][0]);
  const list = names.length ? names.join(', ').replace(/, ([^,]*)$/, ' et $1') : '';
  const ask = ready ? `<div class="thread">
      ${socrate('Hmm. Vous avez choisi : <b>'+esc(list)+'</b>. Si vous deviez renoncer à <u>une</u> de ces trois qualités, laquelle ? Et pourquoi ?')}
      <div class="answer">
        <label class="f" for="a-drop">Notre réponse</label>
        ${taHTML('drop','a-drop','Nous renoncerions à … parce que …')}
        <div class="row"><button type="button" class="mini-btn" data-act="dropHelp">${S.dropHelp?'Aide fermer':'Aide'}</button><span class="hint">Tipp: mindestens ein ganzer Satz mit „parce que“.</span></div>
        ${S.dropHelp ? `<div class="aide"><h4>Pour commencer</h4>${chipsHTML('drop', ['Nous renoncerions à … parce que …','Pour nous, … est moins important, car …','Sans … on peut rester ami(e), mais sans … non.'])}</div>`:''}
      </div>
    </div>` : '';
  return `<section class="card" aria-labelledby="t1">
    <div class="step-title"><h2 id="t1">Échauffement</h2><span class="tag">étape 1</span></div>
    <p class="lead">Qu’est-ce qui compte le plus dans une amitié ? Choisissez ensemble exactement <b>trois</b> qualités.<br><span class="de">Einigt euch auf genau drei Eigenschaften. Antippen zum Wählen und Abwählen.</span></p>
    <p class="count">Qualités choisies : <b>${n} / 3</b></p>
    <div class="qgrid">
      ${QUALITIES.map((q,i)=>{ const on = S.picks.includes(i); const full = n>=3 && !on;
        return `<button type="button" class="qcard" data-act="pick" data-i="${i}" aria-pressed="${on}" ${full?'aria-disabled="true"':''}><b>${q[0]}</b><span class="de">${q[1]}</span></button>`; }).join('')}
    </div>
    ${ask}
    <div class="nav" style="margin-top:20px">
      <button type="button" class="btn" data-act="next" ${ready?'':'disabled'}>Continuer ›</button>
      ${ready ? '' : '<span class="why">Wählt zuerst drei Eigenschaften.</span>'}
    </div>
  </section>`;
}

function blockHTML(i){
  const Q = QUESTIONS[i], st = S.q[i], key = 'q'+i;
  let h = `<div class="thread" id="blk${i}">`;
  h += socrate(`<small class="de" style="display:block;margin-bottom:2px">Question ${i+1} / 3</small>${Q.ask}`);
  if(st.stance === null){
    h += `<div class="stances" role="group" aria-label="Notre position">${Q.stances.map((s,j)=>`<button type="button" class="stance-btn" data-act="stance" data-q="${i}" data-j="${j}">${s.label}</button>`).join('')}</div>`;
    h += `<p class="de" style="margin:0;align-self:flex-end">Einigt euch auf eine Position.</p>`;
  } else {
    const S2 = Q.stances[st.stance];
    if(!st.sent){
      h += `<div class="stances mini" role="group" aria-label="Position ändern">${Q.stances.map((s,j)=>`<button type="button" class="stance-btn ${j===st.stance?'on':''}" data-act="stance" data-q="${i}" data-j="${j}" aria-pressed="${j===st.stance}">${s.label}</button>`).join('')}</div>`;
    } else {
      h += nous(`<div class="stance">${S2.label}</div>`);
    }
    h += socrate(S2.reply);
    if(!st.sent){
      const ok = len(key) >= 8;
      h += `<div class="answer">
        <label class="f" for="a-${key}">Notre réponse</label>
        ${taHTML(key,'a-'+key,'À mon avis, … parce que …')}
        <div class="row">
          <button type="button" class="btn" data-act="send" data-q="${i}" ${ok?'':'disabled'}>Envoyer à Socrate</button>
          <button type="button" class="mini-btn" data-act="help" data-q="${i}">${st.help?'Aide fermer':'Aide'}</button>
          <span class="hint" id="hint-${key}">${ok?'':'Schreibt mindestens einen Satz.'}</span>
        </div>
        ${st.help ? `<div class="aide"><h4>Vocabulaire</h4><div class="chips">${Q.vocab.map(v=>`<span class="chip fixed"><b>${esc(v[0])}</b> = ${esc(v[1])}</span>`).join('')}</div>
          <h4>Pour commencer</h4>${chipsHTML(key, STARTERS)}
          <h4>Subjonctif (défi)</h4>${chipsHTML(key, ['Il faut qu’un ami soit …','Je ne pense pas qu’un pote puisse …'])}</div>`:''}
      </div>`;
    } else {
      h += nous(`<p>${esc(S.vals[key])}</p>`);
      h += socrate(Q.thanks, 'small');
    }
  }
  return h + '</div>';
}

function viewEtape2(){
  let blocks = '';
  for(let i=0;i<=S.qi;i++) blocks += blockHTML(i);
  const done = S.q.every(q=>q.sent);
  return `<section class="card" aria-labelledby="t2">
    <div class="step-title"><h2 id="t2">Dialogue socratique</h2><span class="tag">étape 2</span></div>
    <p class="lead">Socrate pose trois questions. Choisissez une position, répondez à sa contre-question, puis envoyez.<br><span class="de">Richtwert: etwa 3 Minuten pro Frage.</span></p>
    ${blocks}
    <div class="nav" style="margin-top:22px">
      <button type="button" class="btn alt" data-act="back">‹ Retour</button>
      <button type="button" class="btn" data-act="next" ${done?'':'disabled'}>Continuer ›</button>
      ${done ? '' : '<span class="why">Beantwortet zuerst alle drei Fragen.</span>'}
    </div>
  </section>`;
}

function viewEtape3(){
  const okA = len('ami') >= 8, okP = len('pote') >= 8;
  const ok = okA && okP;
  return `<section class="card" aria-labelledby="t3">
    <div class="step-title"><h2 id="t3">Notre définition</h2><span class="tag">étape 3</span></div>
    <p class="lead">Écrivez maintenant ce que vous avez compris. Complétez les deux phrases avec votre propre idée.<br><span class="de">Nutzt eure Ergebnisse aus Etappe 1 und 2. Die Chips unter den Feldern helfen beim Anfangen.</span></p>
    ${S.picks.length===3 ? `<div class="rule-box"><b>Vos trois qualités :</b> ${esc(S.picks.map(i=>QUALITIES[i][0]).join(' · '))}</div>`:''}

    <div class="field">
      <p class="stem">Un(e) <em>ami(e)</em>, c’est quelqu’un qui …</p>
      <label class="f" for="a-ami" style="position:absolute;left:-9999px">Définition ami</label>
      ${taHTML('ami','a-ami','… quelqu’un qui …')}
      ${chipsHTML('ami', AMI_CHIPS)}
    </div>
    <div class="field">
      <p class="stem">Un(e) <em>pote</em>, c’est quelqu’un avec qui …</p>
      <label class="f" for="a-pote" style="position:absolute;left:-9999px">Définition pote</label>
      ${taHTML('pote','a-pote','… avec qui …')}
      ${chipsHTML('pote', POTE_CHIPS)}
    </div>
    <div class="field">
      <p class="stem"><em>Défi</em> (facultatif) : une phrase avec le subjonctif</p>
      <label class="f" for="a-subj" style="position:absolute;left:-9999px">Phrase avec subjonctif</label>
      ${taHTML('subj','a-subj','Il faut qu’un ami …')}
      ${chipsHTML('subj', SUBJ_CHIPS)}
      <div class="forms" aria-label="Formes du subjonctif">${SUBJ_FORMS.map(f=>`<span class="chip fixed">${f[0]} → <b>${f[1]}</b></span>`).join('')}</div>
    </div>

    <div class="rule-box" style="background:#fff"><b>Contrôle avant de continuer :</b>
      <ul class="checks">${CHECKS.map((c,i)=>`<li><label><input type="checkbox" data-act="check" data-i="${i}" ${S.checks[i]?'checked':''}> <span>${c}</span></label></li>`).join('')}</ul>
    </div>

    <div class="nav" style="margin-top:14px">
      <button type="button" class="btn alt" data-act="back">‹ Retour</button>
      <button type="button" class="btn" data-act="next" ${ok?'':'disabled'}>Voir notre carte ›</button>
      ${ok ? '' : '<span class="why">Vervollständigt die beiden ersten Sätze.</span>'}
    </div>
  </section>`;
}

function summaryText(){
  const g = S.group.trim() || 'Notre groupe';
  const L = [];
  L.push('LE CAFÉ SOCRATIQUE · ' + g);
  L.push('');
  L.push('Nos 3 qualités : ' + S.picks.map(i=>QUALITIES[i][0]).join(', '));
  if(S.vals.drop.trim()) L.push('Si on devait renoncer à une qualité : ' + S.vals.drop.trim());
  L.push('');
  QUESTIONS.forEach((Q,i)=>{ L.push((i+1)+'. '+Q.ask); L.push('   '+Q.stances[S.q[i].stance].label+' – '+S.vals['q'+i].trim()); });
  L.push('');
  L.push('Un(e) ami(e), c’est quelqu’un qui ' + S.vals.ami.trim());
  L.push('Un(e) pote, c’est quelqu’un avec qui ' + S.vals.pote.trim());
  if(S.vals.subj.trim()) L.push('Défi : ' + S.vals.subj.trim());
  return L.join('\n');
}

function viewEtape4(){
  const g = S.group.trim() || 'Notre groupe';
  return `<section aria-labelledby="t4">
    <div class="poster">
      <div class="poster-head"><small>LE CAFÉ SOCRATIQUE</small><h3 id="t4">${esc(g)}</h3></div>
      <div class="poster-body">
        <div class="sec"><h4>NOS TROIS QUALITÉS</h4><div class="qs">${S.picks.map(i=>`<span>${esc(QUALITIES[i][0])}</span>`).join('')}</div>
          ${S.vals.drop.trim() ? `<p class="dim" style="margin-top:6px">Si on devait renoncer à une : ${esc(S.vals.drop.trim())}</p>`:''}</div>
        <div class="sec"><h4>NOS RÉPONSES À SOCRATE</h4>
          ${QUESTIONS.map((Q,i)=>`<div class="qa" style="margin-bottom:10px"><div class="q">${esc(Q.ask)}</div><div class="st">${esc(Q.stances[S.q[i].stance].label)}</div><p>${esc(S.vals['q'+i].trim())}</p></div>`).join('')}</div>
        <div class="sec"><h4>NOTRE DÉFINITION</h4>
          <p><b>Un(e) ami(e)</b>, c’est quelqu’un qui ${esc(S.vals.ami.trim())}</p>
          <p style="margin-top:8px"><b>Un(e) pote</b>, c’est quelqu’un avec qui ${esc(S.vals.pote.trim())}</p>
          ${S.vals.subj.trim() ? `<p style="margin-top:8px"><b>Défi :</b> ${esc(S.vals.subj.trim())}</p>`:''}</div>
      </div>
      <div class="poster-foot"></div>
    </div>

    <div class="card noprint" style="margin-bottom:22px">
      <div class="step-title"><h2>À vous de jouer</h2><span class="tag">étape 4</span></div>
      <div class="thread">
        ${socrate('Le porte-parole lit la définition à la classe, en 30 secondes. Et une dernière question pour la maison : <b>quel type d’ami(e) êtes-vous vous-mêmes ?</b>')}
      </div>
      <div class="rule-box"><b>Tipp:</b> Macht einen Screenshot dieser Karte, oder kopiert den Text und schickt ihn eurer Lehrerin.</div>
      <div class="nav">
        <button type="button" class="btn alt" data-act="back">‹ Retour</button>
        <button type="button" class="btn go" data-act="copy">Copier le texte</button>
        <button type="button" class="btn alt" data-act="reset">${S.confirmReset?'Sûr ? Encore une fois':'Recommencer'}</button>
      </div>
      <p class="de" id="copystate" role="status" style="margin:10px 0 0"></p>
      ${S.copyFail ? `<textarea class="copybox" id="copybox" readonly aria-label="Text zum Kopieren">${esc(summaryText())}</textarea>
      <p class="de" style="margin:4px 0 0">Das Kopieren ist hier blockiert. Markiere den Text und kopiere ihn von Hand.</p>`:''}
    </div>
  </section>`;
}

// ============ Rendering ============
const VIEWS = [viewIntro, viewEtape1, viewEtape2, viewEtape3, viewEtape4];

function render(){
  $('#stage').innerHTML = VIEWS[S.step]();
  updateHud();
  if(S.focusKey){
    const ta = document.querySelector(`textarea[data-key="${S.focusKey}"]`);
    if(ta){ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length, ta.value.length); }
    S.focusKey = null;
  }
  if(S.scrollTo){
    const el = document.getElementById(S.scrollTo);
    if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth', block:'start'});
    S.scrollTo = null;
  }
}
function go(n){
  S.step = n; S.max = Math.max(S.max, n); S.stepSec = 0; S.confirmReset = false; S.copyFail = false;
  render();
  window.scrollTo({top:0});
}

// ============ Ereignisse ============
const stage = $('#stage');

stage.addEventListener('input', e=>{
  const t = e.target;
  if(t.id === 'gname'){ S.group = t.value; return; }
  if(t.matches('textarea[data-key]')){
    const k = t.dataset.key;
    S.vals[k] = t.value;
    // Knopf-Zustand ohne Neuaufbau aktualisieren (Fokus bleibt)
    if(/^q\d$/.test(k)){
      const i = +k[1];
      const btn = stage.querySelector(`[data-act="send"][data-q="${i}"]`);
      const ok = len(k) >= 8;
      if(btn) btn.disabled = !ok;
      const hint = $('#hint-'+k); if(hint) hint.textContent = ok ? '' : 'Schreibt mindestens einen Satz.';
    }
    if(k==='ami' || k==='pote'){
      const nb = stage.querySelector('[data-act="next"]');
      const ok = len('ami')>=8 && len('pote')>=8;
      if(nb){ nb.disabled = !ok; const why = nb.parentNode.querySelector('.why'); if(why) why.style.display = ok?'none':''; }
    }
  }
});

stage.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.act === 'check'){ S.checks[+t.dataset.i] = t.checked; }
});

stage.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.dataset.act === 'check') return;
  const a = b.dataset.act;

  if(a === 'start'){ S.running = true; go(1); return; }
  if(a === 'pick'){
    const i = +b.dataset.i, at = S.picks.indexOf(i);
    if(at >= 0) S.picks.splice(at,1); else if(S.picks.length < 3) S.picks.push(i);
    render(); return;
  }
  if(a === 'dropHelp'){ S.dropHelp = !S.dropHelp; render(); return; }
  if(a === 'help'){ const i = +b.dataset.q; S.q[i].help = !S.q[i].help; render(); return; }
  if(a === 'stance'){ const i = +b.dataset.q; S.q[i].stance = +b.dataset.j; render(); return; }
  if(a === 'chip'){
    const k = b.dataset.key, t = b.dataset.t;
    const cur = S.vals[k].replace(/\s+$/,'');
    S.vals[k] = cur ? cur + ' ' + t : t;
    S.focusKey = k; render(); return;
  }
  if(a === 'send'){
    const i = +b.dataset.q;
    if(len('q'+i) < 8) return;
    S.q[i].sent = true;
    if(i < 2){ S.qi = i+1; S.scrollTo = 'blk'+(i+1); }
    render(); return;
  }
  if(a === 'next'){ if(!b.disabled) go(S.step+1); return; }
  if(a === 'back'){ go(S.step-1); return; }
  if(a === 'copy'){
    const txt = summaryText();
    const st = $('#copystate');
    const fail = ()=>{ S.copyFail = true; render(); };
    try{
      if(!navigator.clipboard) return fail();
      navigator.clipboard.writeText(txt).then(()=>{ st.textContent = 'Kopiert ✓ Jetzt irgendwo einfügen, zum Beispiel in eine Nachricht.'; }, fail);
    }catch(err){ fail(); }
    return;
  }
  if(a === 'reset'){
    if(!S.confirmReset){ S.confirmReset = true; render(); setTimeout(()=>{ if(S.confirmReset){ S.confirmReset = false; if(S.step===4) render(); } }, 4000); return; }
    Object.assign(S,{ step:0, max:0, group:'', picks:[], qi:0, dropHelp:false, checks:[false,false,false], total:1200, stepSec:0, running:false, copyFail:false, confirmReset:false });
    S.vals = { drop:'', q0:'', q1:'', q2:'', ami:'', pote:'', subj:'' };
    S.q = [0,1,2].map(()=>({stance:null,sent:false,help:false}));
    render(); window.scrollTo({top:0}); return;
  }
});

$('#hud').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'pause'){ S.running = !S.running; tick(true); return; }
  if(b.dataset.act === 'goto' && !b.disabled){ go(+b.dataset.n); }
});

render();
</script>
