<html lang="de">
<head>
<meta charset="UTF-8">
<title>Français 10ab — Matériel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

:root{
  --purple:#7C5CFC; --purple-bg:#F1EDFF; --pink:#FF5C8A; --orange:#FF8A3D;
  --teal:#1FB6A0; --blue:#3DA9FC; --gold:#F0B429;
  --ink:#20233F; --ink-soft:#5C6188; --bg:#F6F5FC; --card:#FFFFFF; --line:#E7E4F7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
  padding:20px 14px 60px;
}
.wrap{ max-width:760px; margin:0 auto; }

.hero{
  background:linear-gradient(120deg,var(--purple) 0%,var(--pink) 55%,var(--orange) 100%);
  border-radius:24px;
  padding:34px 32px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(124,92,252,0.55);
  margin-bottom:26px;
}
.hero::after{ content:""; position:absolute; right:-40px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.14); }
.hero .eyebrow{ font-family:'Inter',sans-serif; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; opacity:0.92; font-weight:600; }
.hero h1{ font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(28px,5vw,40px); margin:6px 0 8px; line-height:1.1; }
.hero p{ margin:0; font-size:15px; opacity:0.95; max-width:480px; position:relative; z-index:1; }

.grid{ display:grid; gap:16px; }

.link-card{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:20px 22px;
  text-decoration:none;
  color:var(--ink);
  box-shadow:0 8px 22px -16px rgba(32,35,63,0.25);
  transition:transform .15s ease, box-shadow .15s ease;
}
.link-card:hover{ transform:translateY(-3px); box-shadow:0 14px 28px -16px rgba(32,35,63,0.35); }
.link-card .icon{
  font-size:28px;
  width:56px; height:56px;
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.link-card.c1 .icon{ background:var(--purple-bg); }
.link-card.c2 .icon{ background:#E4FBF6; }
.link-card h3{ font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; margin:0 0 4px; }
.link-card p{ margin:0; font-size:13.5px; color:var(--ink-soft); }
.link-card .arrow{ margin-left:auto; font-size:20px; color:var(--ink-soft); }

.soon{
  border-style:dashed;
  opacity:0.55;
  cursor:default;
}
.soon:hover{ transform:none; box-shadow:0 8px 22px -16px rgba(32,35,63,0.25); }

footer.foot{
  text-align:center;
  padding:26px 0 6px;
  font-family:'Inter',sans-serif;
  font-size:12px;
  color:var(--ink-soft);
  opacity:0.7;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">10ab · Français</div>
    <h1>Bienvenue ! 🇫🇷</h1>
    <p>Hier findest du alle interaktiven Materialien für den Französischunterricht. Einfach draufklicken!</p>
  </div>

  <div class="grid">
    <a class="link-card c1" href="subjonctif.html">
      <div class="icon">🎯</div>
      <div>
        <h3>Le Subjonctif</h3>
        <p>Bildung, Gebrauch, Übung &amp; kreatives Schreiben</p>
      </div>
      <div class="arrow">→</div>
    </a>

    <div class="link-card soon c2">
      <div class="icon">📘</div>
      <div>
        <h3>Weitere Materialien</h3>
        <p>Hier kommt bald mehr dazu</p>
      </div>
    </div>
  </div>

  <footer class="foot">10ab Horlacher</footer>
</div>
</body>
</html>
